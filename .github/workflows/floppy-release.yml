name: Floppy release on upstream release

# Polls the upstream memtest86plus repo for new releases and, when one or more
# appear that we haven't published yet, builds floppy.img for i586 and x86_64
# and cuts a matching release in this fork. See README / release-tagging
# notes: `gh release create` is used as the single command that creates both
# the tag and the GitHub release.
#
# Detection is two-tiered:
#   1. Cheap path (every run): compare our latest release tag against
#      upstream's latest. If equal, we're in sync; jobs that follow are
#      skipped via the empty-matrix rule and the run exits in seconds.
#   2. Backfill path (only when latest tags differ): list all upstream
#      releases and all of ours, compute the set difference, build them all.

on:
  schedule:
    # Mon/Wed/Fri at 12:17 UTC. Offset off the hour to avoid the scheduler spike on :00.
    - cron: '17 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (e.g. v8.00). Blank = run normal drift check.'
        required: false
        default: ''
      force:
        description: 'Rebuild even if a release with that tag already exists in this repo'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: floppy-release
  cancel-in-progress: false

env:
  UPSTREAM: memtest86plus/memtest86plus

jobs:
  detect:
    name: Detect drift
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve tags to build
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # 1) Manual dispatch with an explicit tag: build exactly that one.
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "Manual dispatch tag: ${INPUT_TAG}"
            TAGS_JSON=$(jq -c -n --arg t "${INPUT_TAG}" '[$t]')
            echo "tags=${TAGS_JSON}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Enumerate ALL upstream git tags (including older tags like v6.00
          # and the v6.00-beta* pre-releases that never got a GitHub Release
          # entry), ordered by tag-commit date ASCENDING (oldest first).
          # One GraphQL call covers both "list every tag" and "give me the
          # canonical chronological order" in a single hop.
          OWNER="${UPSTREAM%/*}"
          REPO="${UPSTREAM#*/}"
          # shellcheck disable=SC2016 # $owner/$repo are GraphQL variables, not shell expansions
          UPSTREAM_TAGS=$(gh api graphql -F owner="${OWNER}" -F repo="${REPO}" -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                refs(refPrefix: "refs/tags/", first: 100,
                     orderBy: {field: TAG_COMMIT_DATE, direction: ASC}) {
                  nodes { name }
                }
              }
            }
          ' --jq '[.data.repository.refs.nodes[].name]')
          echo "Upstream tags (oldest first): ${UPSTREAM_TAGS}"

          # 2) Force flag without an explicit tag: rebuild the newest upstream tag.
          if [ "${FORCE:-false}" = "true" ]; then
            UPSTREAM_LATEST=$(jq -r '.[-1]' <<<"${UPSTREAM_TAGS}")
            echo "Force-rebuild requested; building upstream latest (${UPSTREAM_LATEST})."
            TAGS_JSON=$(jq -c -n --arg t "${UPSTREAM_LATEST}" '[$t]')
            echo "tags=${TAGS_JSON}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 3) Diff against our existing release tags. Set difference preserves
          # the upstream chronological order, so the resulting matrix processes
          # oldest-first; combined with max-parallel:1 on release, the newest
          # tag is published last and appears at the top of the releases page.
          OUR_TAGS=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName --jq '[.[].tagName]')
          echo "Our tags: ${OUR_TAGS}"
          TAGS_JSON=$(jq -c -n --argjson u "${UPSTREAM_TAGS}" --argjson o "${OUR_TAGS}" '
            [ $u[] | select( . as $t | ($o | index($t)) | not ) ]
          ')
          if [ "${TAGS_JSON}" = "[]" ]; then
            echo "Up to date; nothing to build."
          else
            echo "Missing tags (oldest first): ${TAGS_JSON}"
          fi
          echo "tags=${TAGS_JSON}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.tag }} (${{ matrix.arch }})
    needs: detect
    if: needs.detect.outputs.tags != '[]'
    # Match the older toolchain used by upstream's own Linux.yml so older
    # tags build cleanly. ubuntu-24.04's stricter compiler/linker has been
    # observed to break some pre-v8.00 sources.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.detect.outputs.tags) }}
        arch: [i586, x86_64]
    steps:
      - name: Checkout upstream at ${{ matrix.tag }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ matrix.tag }}
          fetch-depth: 1

      - name: Resolve build directory for layout
        id: layout
        # Upstream restructured the build dirs at v8.00:
        #   v8.00+         -> build/i586, build/x86_64
        #   v6.01 - v7.20  -> build32,    build64
        # Pick whichever exists for this tag/arch.
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
            i586)   candidates="build/i586 build32" ;;
            x86_64) candidates="build/x86_64 build64" ;;
            *) echo "::error::unknown arch ${ARCH}"; exit 1 ;;
          esac
          dir=""
          for c in ${candidates}; do
            if [ -d "${c}" ]; then dir="${c}"; break; fi
          done
          if [ -z "${dir}" ]; then
            echo "::error::No build dir found for ${TAG}/${ARCH} (looked for: ${candidates})"
            exit 1
          fi
          echo "Selected build directory: ${dir}"
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            clang \
            libc6-dev-i386-cross \
            dosfstools \
            mtools

      - name: Build floppy.img
        working-directory: ${{ steps.layout.outputs.dir }}
        env:
          TAG: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make -j"$(nproc)" floppy.img
          out="memtest86plus-${TAG}-${ARCH}-floppy.img"
          mv floppy.img "${out}"
          ls -l "${out}"

      - name: Upload floppy artifact
        uses: actions/upload-artifact@v4
        with:
          name: floppy-${{ matrix.tag }}-${{ matrix.arch }}
          path: ${{ steps.layout.outputs.dir }}/memtest86plus-${{ matrix.tag }}-${{ matrix.arch }}-floppy.img
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish ${{ matrix.tag }}
    needs: [detect, build]
    # `!cancelled()` lets release run for tags whose builds succeeded even if
    # a different tag's build failed (build has fail-fast:false). The
    # per-tag artifact-existence check below short-circuits failed ones.
    if: ${{ !cancelled() && needs.detect.outputs.tags != '[]' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Serialize so releases are created in chronological order (oldest
      # first); newest ends up last and therefore appears at the top of the
      # GitHub releases page.
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.detect.outputs.tags) }}
    steps:
      - name: Download floppy artifacts for ${{ matrix.tag }}
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: floppy-${{ matrix.tag }}-*
          path: dist
          merge-multiple: true

      - name: Verify both floppy images are present
        id: check
        run: |
          set -euo pipefail
          # Expect exactly two .img files (i586 + x86_64). If either build
          # failed upstream of us, skip publishing this tag rather than ship
          # a partial release.
          count=$(find dist -maxdepth 1 -name '*.img' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Found ${count} floppy image(s) for ${{ matrix.tag }}."
          if [ "${count}" -lt 2 ]; then
            echo "::warning::Skipping release of ${{ matrix.tag }} - expected 2 floppy images, found ${count}."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate checksums
        if: steps.check.outputs.skip != 'true'
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- *.img | tee SHA256SUMS

      - name: Create release ${{ matrix.tag }}
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail

          # Pre-release policy:
          #   * Tags in the BACKFILL_TAGS snapshot (the upstream tag set as
          #     of this fork's first publish) are always released as stable,
          #     including historical -beta tags. The backfill is a one-shot
          #     catch-up; we don't want it cluttering the prerelease tab.
          #   * Any tag NOT in the snapshot follows the semver -suffix rule:
          #     a tag containing a dash (e.g. vX.Y-betaN, vX.Y-rcN) is
          #     marked prerelease via gh's native --prerelease flag.
          BACKFILL_TAGS="v6.00-beta1 v6.00-beta2 v6.00-beta3 v6.00 v6.01 v6.10 v6.20 v7.00 v7.20 v8.00"
          case " ${BACKFILL_TAGS} " in
            *" ${TAG} "*)
              IS_PRERELEASE=false
              echo "Tag ${TAG} is in the backfill snapshot; releasing as stable."
              ;;
            *)
              case "${TAG}" in
                *-*) IS_PRERELEASE=true ;;
                *)   IS_PRERELEASE=false ;;
              esac
              echo "Tag ${TAG} is a forward release; prerelease=${IS_PRERELEASE}"
              ;;
          esac

          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="memtest86+ ${TAG} (floppy, pre-release)"
          else
            PRERELEASE_FLAG=""
            TITLE="memtest86+ ${TAG} (floppy)"
          fi

          # If a release already exists (force-rebuild path), remove it first
          # so `gh release create` can recreate it atomically with the new assets.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Removing existing release ${TAG} for re-publish."
            gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          fi

          # Pull upstream's own release notes verbatim and prepend a header
          # describing the floppy images shipped on this release. Older
          # tags (and pre-release tags) may not have a GitHub Release body;
          # the helper falls back to a "no body" line in that case.
          upstream_body=$(gh release view "${TAG}" --repo "${UPSTREAM}" --json body --jq .body 2>/dev/null || true)

          {
            if [ "${IS_PRERELEASE}" = "true" ]; then
              echo "> :warning: **Pre-release.** This release tracks upstream's pre-release tag \`${TAG}\` and is not a stable release."
              echo
            fi
            echo "## Floppy disk images"
            echo
            echo "This is an automated rebuild of upstream [\`${UPSTREAM}@${TAG}\`](https://github.com/${UPSTREAM}/releases/tag/${TAG}) packaged as 1.44 MB floppy disk images. Each \`*-floppy.img\` can be written directly to a 3.5\" floppy or booted via legacy BIOS as a floppy image (loopback, ROM emulation, virtual floppy in QEMU/VirtualBox, etc.)."
            echo
            echo "| Architecture       | File                                              |"
            echo "|--------------------|---------------------------------------------------|"
            echo "| x86 32-bit (i586)  | \`memtest86plus-${TAG}-i586-floppy.img\`           |"
            echo "| x86-64 (64-bit)    | \`memtest86plus-${TAG}-x86_64-floppy.img\`         |"
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "---"
            echo
            echo "## Upstream release notes"
            echo
            if [ -n "${upstream_body}" ]; then
              printf '%s\n' "${upstream_body}"
            else
              echo "_Upstream did not publish a release body for [\`${TAG}\`](https://github.com/${UPSTREAM}/releases/tag/${TAG})._"
            fi
          } > notes.md

          # shellcheck disable=SC2086 # PRERELEASE_FLAG is intentionally word-split
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --notes-file notes.md \
            ${PRERELEASE_FLAG} \
            dist/*.img dist/SHA256SUMS
